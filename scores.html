<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>科目別成績 ・ 武藤模試</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/styles/theme.css">
<style>
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fraunces',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  #app-shell-bar{position:fixed;top:0;left:0;right:0;z-index:100}
  main{max-width:900px;margin:0 auto;padding:72px 16px 40px}
  main h1{font-size:1.15rem;margin:8px 0 16px}
  #scores-content{font-size:.85rem;margin-top:8px}
  /* 横スクロール時に「#」列と「名前」列を固定表示 */
  #scores-content .ranking-table th:first-child,
  #scores-content .ranking-table td:first-child:not([colspan]),
  #scores-content .ranking-table th:nth-child(2),
  #scores-content .ranking-table td:nth-child(2):not([colspan]){
    position:sticky;z-index:3;background:var(--bg);
    box-shadow:inset 0 -1px 0 var(--line);
  }
  #scores-content .ranking-table th:first-child,
  #scores-content .ranking-table td:first-child:not([colspan]){
    left:0;box-sizing:border-box;width:38px;min-width:38px;
    padding-left:10px;padding-right:4px;
  }
  #scores-content .ranking-table th:nth-child(2),
  #scores-content .ranking-table td:nth-child(2):not([colspan]){
    left:38px;border-right:1px solid var(--line);
  }
  /* みっつー波多野ライン: 横スクロールせず表示領域の端から端まで固定 */
  #scores-content .mh-line{
    position:sticky;left:0;z-index:4;
    background:linear-gradient(rgba(239,68,68,.12),rgba(239,68,68,.12)),var(--bg);
  }
  .score-input-row{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
  .score-input-row button{font-family:inherit;font-size:.85rem;padding:8px 16px;border-radius:10px;cursor:pointer}
</style>
</head>
<body>
<div id="app-shell-bar"></div>
<main>
  <h1>📊 科目別成績 <span id="scores-exam-label" style="font-size:.75rem;color:var(--muted);font-weight:400"></span></h1>
  <div id="scores-content">読み込み中...</div>
  <div class="score-input-row" id="score-input-row"></div>
  <div id="score-inline-wrap" style="display:none;margin-top:10px;padding:10px 12px;background:rgba(70,214,196,.07);border:1px solid rgba(70,214,196,.3);border-radius:8px;align-items:center;gap:8px;flex-wrap:wrap">
    <span id="score-inline-label" style="font-size:.85rem;color:var(--dim)"></span>
    <input id="score-inline-val" type="number" min="0" max="100" placeholder="0〜100" style="width:80px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#0a172b;color:var(--fg);font-size:.9rem;font-family:inherit" onkeydown="if(event.key==='Enter')_confirmScoreInline()">
    <button onclick="_confirmScoreInline()" style="padding:5px 14px;border:none;border-radius:6px;background:var(--teal);color:#0a1626;font-weight:700;cursor:pointer;font-size:.85rem">登録</button>
    <button onclick="document.getElementById('score-inline-wrap').style.display='none'" style="padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:none;color:var(--dim);cursor:pointer;font-size:.85rem">✕</button>
  </div>
</main>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/app-shell.js"></script>
<script src="/js/util.js"></script>
<script>
let authToken = null, authUser = null, authUserId = null, authEmail = null;
function _syncAuthGlobals() {
  const u = window.appShell && window.appShell.user;
  authToken  = (window.appShell && window.appShell.token) || null;
  authUser   = u ? u.username : null;
  authUserId = u ? u.id : null;
  authEmail  = u ? (u.email || '') : null;
}
window.addEventListener('appshell:auth', () => { _syncAuthGlobals(); onAuthReady(); });

appShell.mount(document.getElementById('app-shell-bar'), {
  nav: window.APP_NAV,
});

// /api/exam-subjects から取得する、いまの試験の科目定義（列・ラベル・色・50点満点なら maxRaw）
let _examSubjects = [];
let _examName = '';
async function loadExamSubjects() {
  try {
    const data = await fetch('/api/exam-subjects').then(r => r.json());
    _examSubjects = Array.isArray(data.subjects) ? data.subjects : [];
    _examName = data.exam || '';
    document.getElementById('scores-exam-label').textContent = _examName ? `（${_examName}）` : '';
  } catch(e) { _examSubjects = []; }
}

// 科目の値を「換算後(生点)」表示に変換（maxRawが無ければそのまま）。ソート・合計・平均には換算後の値を使う
function _convVal(sub, raw) {
  if (raw == null) return null;
  return sub.maxRaw ? raw * (100 / sub.maxRaw) : raw;
}

let _scSort = { key: '_avg', dir: 1 };
async function loadScores() {
  const el = document.getElementById('scores-content');
  try {
    if (!_examSubjects.length) await loadExamSubjects();
    const res  = await fetch('/api/scores');
    const data = await res.json();
    if (!Array.isArray(data) || !data.length) { el.innerHTML = '<p style="color:var(--muted)">まだ点数が登録されていません</p>'; return; }
    if (!_examSubjects.length) { el.innerHTML = '<p style="color:var(--muted)">科目情報を読み込めませんでした</p>'; return; }

    // 平均点・合計点を計算（入力済み科目のみ、換算後の値を使用）
    data.forEach(r => {
      const vals = _examSubjects.map(s => _convVal(s, r[s.column])).filter(v => v != null);
      r._avg   = vals.length ? vals.reduce((s, v) => s + v, 0) / vals.length : null;
      r._total = vals.length ? vals.reduce((s, v) => s + v, 0) : null;
    });

    const subByCol = {};
    _examSubjects.forEach(s => { subByCol[s.column] = s; });
    const sortKeyVal = (r, key) => {
      if (key === '_avg' || key === '_total') return r[key];
      const sub = subByCol[key];
      return sub ? _convVal(sub, r[key]) : r[key];
    };

    // # 列: 現在のソートキーで昇順に並べた順位（ソートが変わると連動）
    const rankBase = [...data].sort((a, b) => {
      const av = sortKeyVal(a, _scSort.key), bv = sortKeyVal(b, _scSort.key);
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      return av - bv;
    });
    let rnk = 0, prevV = null;
    const rankMap = {};
    rankBase.forEach((r, i) => {
      const v = sortKeyVal(r, _scSort.key);
      if (v == null) { rankMap[r.username] = null; return; }
      if (v !== prevV) { rnk = i + 1; prevV = v; }
      rankMap[r.username] = rnk;
    });

    // 選択キーでソート、未入力は末尾
    const sorted = [...data].sort((a, b) => {
      const av = sortKeyVal(a, _scSort.key), bv = sortKeyVal(b, _scSort.key);
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      return (av - bv) * _scSort.dir;
    });

    const sc = (sub, raw) => {
      if (raw == null) return `<span style="color:var(--dim);font-size:.8rem">―</span>`;
      if (sub.maxRaw) {
        const conv = Math.round(raw * (100 / sub.maxRaw));
        return `<span style="font-weight:700;color:var(--teal)">${conv}<span style="color:var(--dim);font-size:.78em">(${raw})</span></span>`;
      }
      return `<span style="font-weight:700;color:var(--teal)">${raw}</span>`;
    };

    const th = (key, label, extraStyle='') => {
      const active = _scSort.key === key;
      const arr = active ? (_scSort.dir === 1 ? ' ↑' : ' ↓') : '';
      const col = active ? ';color:var(--amber)' : '';
      return `<th style="text-align:center;cursor:pointer;user-select:none${col}${extraStyle}" onclick="sortScores('${key}')">${label}${arr}</th>`;
    };

    // みっつー波多野ライン: 現在のソートキーに値がある場合のみ基準に使う
    const _lk = _scSort.key;
    const mittsIdx  = (() => { const i = sorted.findIndex(r => r.username === 'ミッツ' && sortKeyVal(r,_lk) != null); return i >= 0 ? i : null; })();
    const hatanoIdx = (() => { const i = sorted.findIndex(r => r.username === '波多野裏技' && sortKeyVal(r,_lk) != null); return i >= 0 ? i : null; })();
    // lineIdx行の「後ろ」に線が描画される
    // 降順：高い方（小さいidx）の上に線 → lineIdx = Math.min - 1
    // 昇順：悪い方（大きいidx）の後に線  → lineIdx = Math.max
    const _lineDesc = _scSort.dir === -1;
    let lineIdx = null;
    if (mittsIdx != null && hatanoIdx != null) {
      lineIdx = _lineDesc ? Math.min(mittsIdx, hatanoIdx) - 1 : Math.max(mittsIdx, hatanoIdx);
    } else if (mittsIdx != null) {
      lineIdx = _lineDesc ? mittsIdx - 1 : mittsIdx;
    } else if (hatanoIdx != null) {
      lineIdx = _lineDesc ? hatanoIdx - 1 : hatanoIdx;
    }

    const colspan = _examSubjects.length + 4; // #, 名前, 科目...,合計, 平均

    const rows = sorted.map((r, i) => {
      const isMe = r.username === authUser;
      const inZone = lineIdx !== null && (_lineDesc ? i > lineIdx : i <= lineIdx);
      const ar = rankMap[r.username];
      const rankTd = ar != null
        ? `<td class="rank-num${ar <= 3 ? ' top' : ''}">${ar}</td>`
        : `<td class="rank-num" style="color:var(--dim)">―</td>`;
      const avgTd = r._avg != null
        ? `<td style="text-align:center;font-weight:700;color:var(--amber)">${Math.round(r._avg * 10) / 10}</td>`
        : `<td style="text-align:center;color:var(--dim);font-size:.8rem">―</td>`;
      const subjCells = _examSubjects.map(s => `<td style="text-align:center">${sc(s, r[s.column])}</td>`).join('');
      const styles = [];
      if (isMe) styles.push('background:rgba(70,214,196,.06)');
      else if (inZone) styles.push('background:rgba(239,68,68,.08)');
      const rowAttr = styles.length ? ` style="${styles.join(';')}"` : '';
      const row = `<tr${rowAttr}>
        ${rankTd}
        <td class="rank-name">
          <span class="avatar frame-${r.frame||'default'}" style="width:20px;height:20px;font-size:.78rem;margin-right:5px;vertical-align:middle">${r.avatar||'🐸'}</span>
          <span>${esc(tu(r.username))}${isMe ? ' 👈' : ''}</span>
        </td>
        ${subjCells}
        ${r._total != null ? `<td style="text-align:center;font-weight:700;color:var(--rose)">${Math.round(r._total)}</td>` : `<td style="text-align:center;color:var(--dim);font-size:.8rem">―</td>`}
        ${avgTd}
      </tr>`;
      if (i === lineIdx) {
        return row + `<tr><td colspan="${colspan}" style="padding:0;border:none">
          <div class="mh-line" style="display:flex;align-items:center;gap:8px;padding:4px 10px 5px">
            <div style="flex:1;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#ef4444)"></div>
            <span style="font-size:.7rem;color:#ef4444;font-weight:900;letter-spacing:.1em;white-space:nowrap;text-shadow:0 0 8px rgba(239,68,68,.6)">みっつー波多野ライン</span>
            <div style="flex:1;height:3px;border-radius:2px;background:linear-gradient(90deg,#ef4444,transparent)"></div>
          </div>
        </td></tr>`;
      }
      return row;
    }).join('');

    const headerCells = _examSubjects.map(s => th(s.column, `${s.icon||''} ${esc(s.label)}`)).join('');

    el.innerHTML = `<div class="table-scroll"><table class="ranking-table">
      <thead><tr>
        <th>#</th>
        <th>名前</th>
        ${headerCells}
        ${th('_total', '合計')}
        ${th('_avg', '平均')}
      </tr></thead>
      <tbody>${rows}</tbody>
    </table></div>`;
    _fitMHLine();
  } catch(e) { el.innerHTML = '<p style="color:var(--muted)">読み込みエラー</p>'; }
}
// みっつー波多野ラインの帯を、横スクロール領域の表示幅ぴったりに合わせる
function _fitMHLine() {
  const el = document.getElementById('scores-content');
  const ts = el && el.querySelector('.table-scroll');
  if (!ts) return;
  el.querySelectorAll('.mh-line').forEach(line => { line.style.width = ts.clientWidth + 'px'; });
}
window.addEventListener('resize', _fitMHLine);
function sortScores(key) {
  if (_scSort.key === key) _scSort.dir *= -1;
  else { _scSort.key = key; _scSort.dir = 1; }
  loadScores();
}

// 科目ごとの入力ボタンを /api/exam-subjects の定義から生成する
async function refreshScoresPage() {
  if (!_examSubjects.length) await loadExamSubjects();
  const row = document.getElementById('score-input-row');
  row.innerHTML = _examSubjects.map(s => {
    const color = s.color || 'var(--teal)';
    return `<button style="display:${authToken ? 'inline-block' : 'none'};border:1px solid ${color};background:color-mix(in srgb, ${color} 12%, transparent);color:${color}"
      onclick="submitSubjectScore('${s.key}', ${JSON.stringify(s.label)}, ${s.maxRaw || 100})">${s.icon||''} ${esc(s.label)}の点数を入力</button>`;
  }).join('');
  await loadScores();
}

let _scoreEndpoint = '', _scoreMax = 100;
async function submitSubjectScore(key, label, maxRaw) {
  if (!authToken) { alert('ログインしてください'); return; }
  _scoreEndpoint = '/api/score/' + key;
  _scoreMax = maxRaw;
  const wrap = document.getElementById('score-inline-wrap');
  document.getElementById('score-inline-label').textContent = `${label}（0〜${maxRaw}点）:`;
  const input = document.getElementById('score-inline-val');
  input.max = maxRaw;
  input.placeholder = `0〜${maxRaw}`;
  input.value = '';
  wrap.style.display = 'flex';
  setTimeout(() => input.focus(), 50);
}
async function _confirmScoreInline() {
  const n = parseInt(document.getElementById('score-inline-val').value, 10);
  if (isNaN(n) || n < 0 || n > _scoreMax) { alert(`0〜${_scoreMax}の整数で入力してください`); return; }
  try {
    const res  = await fetch(_scoreEndpoint, { method:'POST', headers:{'Content-Type':'application/json','Authorization':authToken}, body: JSON.stringify({ score: n }) });
    const data = await res.json();
    if (data.ok) { document.getElementById('score-inline-wrap').style.display = 'none'; await refreshScoresPage(); }
    else alert('❌ ' + (data.error || 'エラー'));
  } catch(e) { alert('通信エラー'); }
}

function onAuthReady() { refreshScoresPage(); }
loadScores();   // 認証解決前でも表本体は出す
</script>
</body>
</html>
