<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理 ・ 武藤模試</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/styles/theme.css">
<style>
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fraunces',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
  #app-shell-bar{position:fixed;top:0;left:0;right:0;z-index:100}
  main{max-width:720px;margin:0 auto;padding:72px 16px 48px}
  main h1{font-size:1.15rem;margin:8px 0 14px}
  #admin-actions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
  #admin-actions button{padding:10px 12px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.88rem;font-weight:600}
  #admin-guard-msg{color:var(--dim);font-size:.9rem;padding:24px 0}
</style>
</head>
<body>
<div id="app-shell-bar"></div>
<main>
  <div id="admin-guard-msg" hidden>権限がありません。管理者アカウントでログインしてください。</div>
  <div id="admin-root" hidden>
    <h1>登録ユーザー一覧 <span id="admin-count" style="font-size:.8rem;color:var(--muted);font-weight:400"></span></h1>
    <div id="admin-content" style="margin-top:8px"></div>
    <div id="admin-actions">
      <button onclick="openScheduleModal()" style="background:#1e2a1e;color:#86efac;border:1px solid #4ade80;font-weight:700">📅 日程管理</button>
      <button onclick="openTimetableModal()" style="background:#1e2333;color:#8ec5ff;border:1px solid #4a8fd6;font-weight:700">🗓 時間割</button>
      <button onclick="restorePointsManual()" style="background:#0f766e;color:#fff;border:none;font-weight:700">♻️ ポイント復元</button>
      <button onclick="debugPoints()" style="background:#374151;color:#9ca3af;border:none;font-weight:700">🔍 DB確認</button>
      <button onclick="resetSeasonPoints()" style="background:#374151;color:#9ca3af;border:none;font-weight:700">🔄 シーズンリセット</button>
      <button id="reg-lock-btn" onclick="toggleRegistrationLock()" style="background:#dc2626;color:#fff;border:none;font-weight:700">🚫 新規登録制限</button>
      <button id="lock-btn" onclick="toggleSiteLock()" style="background:#dc2626;color:#fff;border:none;font-weight:700">🔒 アクセス制限</button>
      <button id="score-lock-btn" onclick="toggleScoreLock()" style="background:#dc2626;color:#fff;border:none;font-weight:700">✏️ 得点入力締め切り</button>
      <button onclick="adjustStudyLog()" style="background:#0f766e;color:#fff;border:none;font-weight:700">⏱️ 勉強時間修正</button>
      <button onclick="grantAll()" style="background:#7c3aed;color:#fff;border:none;font-weight:700">🎁 全員配布</button>
      <button onclick="distributePool()" style="background:#d97706;color:#fff;border:none;font-weight:700">💰 配分</button>
      <button onclick="viewSurveyResults()" style="background:#0ea5e9;color:#fff;border:none;font-weight:700">📊 アンケート結果</button>
      <button onclick="awardWorstFrame()" style="background:#ff3333;color:#fff;border:none;font-weight:700">🔴 1位に付与</button>
      <button onclick="awardBakaFrame()" style="background:linear-gradient(90deg,#ff00ff,#ff6600);color:#fff;border:none;font-weight:700">🔥 下位3フレーム付与</button>
      <button onclick="adminAddBanner()" style="background:#1e3320;color:#86efac;border:1px solid #4ade80;font-weight:700">📢 バナー追加</button>
      <button onclick="adminCreateBattles()" style="background:#1e3a5f;color:#7dd3fc;border:1px solid #3b82f6;font-weight:700">⚔️ バトル作成</button>
      <button onclick="adminAddBattlePair()" style="background:#1a2e1a;color:#86efac;border:1px solid #22c55e;font-weight:700">➕ ペア追加</button>
      <button onclick="adminRefundAllBattles()" style="background:#2a0a0a;color:#fca5a5;border:1px solid #ef4444;font-weight:700">💸 全返金</button>
      <button onclick="adminCloseBattles()" style="background:#2a1a0a;color:#fbbf24;border:1px solid #d97706;font-weight:700">🔒 バトル終了</button>
      <button onclick="adminSettleManual()" style="background:#1a1a2e;color:#c4b5fd;border:1px solid #8b5cf6;font-weight:700">🎯 手動決着</button>
      <button onclick="adminSettleBattles()" style="background:#1e1e3f;color:#a78bfa;border:1px solid #7c3aed;font-weight:700">🏆 バトル決着</button>
      <button onclick="openRaceModal()" style="background:#0f2a1a;color:#6ee7b7;border:1px solid #34d399;font-weight:700">🏁 レース発行</button>
      <button onclick="adminCloseRace()" style="background:#2a1a0a;color:#fcd34d;border:1px solid #f59e0b;font-weight:700">🔒 レース終了</button>
      <button onclick="openPairModal()" style="background:#1a2a1a;color:#86efac;border:1px solid #4ade80;font-weight:700">👥 ペア設定</button>
    </div>
  </div>
</main>

<!-- openTimetableModal / openScheduleModal 等が getElementById('admin-modal-bg').classList を触るので、
     壊さず no-op にするためのスタブ（本物のモーダルは index.html 側）。 -->
<div class="modal-bg" id="admin-modal-bg" hidden></div>

<div class="modal-bg" id="race-modal-bg">
  <div class="modal" id="race-modal-inner" style="width:min(500px,96vw);max-height:90vh;display:flex;flex-direction:column;padding:20px 16px">
    <button onclick="closeRaceModal()" style="position:absolute;top:14px;right:14px;background:none;border:none;color:var(--dim);font-size:1.3rem;cursor:pointer;line-height:1;padding:4px">✕</button>
    <h2 style="flex-shrink:0">🏁 新規レース発行</h2>
    <div style="overflow-y:auto;flex:1;padding-right:2px">
      <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
        <div>
          <label style="font-size:.78rem;color:var(--dim)">レース名</label>
          <input id="race-name-input" type="text" placeholder="例: 前期末レース" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.9rem;font-family:inherit">
        </div>
        <div>
          <label style="font-size:.78rem;color:var(--dim)">対象教科（自動計測に使用）</label>
          <select id="race-subject-input" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.88rem;font-family:inherit">
            <option value="">（教科を選択）</option>
          </select>
        </div>
        <div style="display:flex;gap:10px">
          <div style="flex:1">
            <label style="font-size:.78rem;color:var(--dim)">開始日時</label>
            <input id="race-start-input" type="datetime-local" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.88rem;font-family:inherit">
          </div>
          <div style="flex:1">
            <label style="font-size:.78rem;color:var(--dim)">終了日時</label>
            <input id="race-end-input" type="datetime-local" style="display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:.88rem;font-family:inherit">
          </div>
        </div>
      </div>
    </div>
    <div class="modal-btns" style="flex-shrink:0;margin-top:14px">
      <button onclick="adminCreateRace()" style="background:var(--teal);color:#0a1626;font-weight:700;border:none">🏁 発行</button>
      <button onclick="closeRaceModal()" style="background:transparent;color:var(--dim);border:1px solid var(--line)">キャンセル</button>
    </div>
    <div id="race-modal-msg" class="modal-msg"></div>
  </div>
</div>

<div class="modal-bg" id="schedule-modal-bg">
  <div class="modal" style="width:min(460px,95vw);max-height:90vh;display:flex;flex-direction:column">
    <button onclick="closeScheduleModal()" style="position:absolute;top:14px;right:14px;background:none;border:none;color:var(--dim);font-size:1.3rem;cursor:pointer;line-height:1;padding:4px">✕</button>
    <h2>📅 試験日程管理</h2>
    <p style="font-size:.78rem;color:var(--muted);margin-bottom:14px;flex-shrink:0">設定日以降、その試験のテストが自動でアーカイブされます</p>
    <div id="schedule-content" style="flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:8px"></div>
    <div class="modal-btns" style="margin-top:12px;flex-shrink:0;flex-wrap:wrap;gap:8px">
      <button onclick="archiveAllTests()" style="background:#1e2a1e;color:#86efac;border:1px solid #4ade80;font-weight:700">📦 全部アーカイブ</button>
      <button onclick="closeScheduleModal()" style="background:transparent;color:var(--dim);border:1px solid var(--line)">閉じる</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="timetable-modal-bg">
  <div class="modal" style="width:min(560px,95vw);max-height:90vh;display:flex;flex-direction:column">
    <button onclick="closeTimetableModal()" style="position:absolute;top:14px;right:14px;background:none;border:none;color:var(--dim);font-size:1.3rem;cursor:pointer;line-height:1;padding:4px">✕</button>
    <h2>🗓 試験時間割の登録</h2>
    <p style="font-size:.78rem;color:var(--muted);margin-bottom:14px;flex-shrink:0">ここで登録した内容がトップページに掲示されます。リンク欄に対策ページのURLを入れると「対策 →」ボタンが出ます</p>
    <div id="timetable-content" style="flex:1;overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:8px"></div>
    <div class="modal-btns" style="margin-top:12px;flex-shrink:0">
      <button onclick="closeTimetableModal()" style="background:transparent;color:var(--dim);border:1px solid var(--line)">閉じる</button>
    </div>
  </div>
</div>


<div class="modal-bg" id="pair-modal-bg" style="display:none">
  <div class="modal" style="width:min(480px,96vw);max-height:90vh;display:flex;flex-direction:column;padding:20px 16px">
    <button onclick="closePairModal()" style="position:absolute;top:14px;right:14px;background:none;border:none;color:var(--dim);font-size:1.3rem;cursor:pointer">✕</button>
    <h2 style="flex-shrink:0">👥 ペア設定</h2>
    <p id="pair-modal-race-name" style="font-size:.78rem;color:var(--dim);margin-bottom:12px;flex-shrink:0"></p>
    <div id="pair-modal-pairs" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px"></div>
    <div style="display:flex;gap:8px;margin-top:12px;flex-shrink:0">
      <button onclick="pairAddGroup()" style="flex:1;background:var(--card2);border:1px solid var(--line)">＋ ペア追加</button>
      <button onclick="savePairs()" style="flex:1;background:var(--teal);color:#0a1626;border:none;font-weight:700">💾 保存</button>
    </div>
    <div id="pair-modal-msg" style="font-size:.78rem;color:var(--teal);margin-top:8px;flex-shrink:0"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/app-shell.js"></script>
<script src="/js/util.js"></script>
<script>
let authToken = null, authUser = null, authEmail = null, authUserId = null;
function _syncAuthGlobals() {
  var u = window.appShell && window.appShell.user;
  authToken  = (window.appShell && window.appShell.token) || null;
  authUser   = u ? u.username : null;
  authEmail  = u ? (u.email || '') : null;
  authUserId = u ? u.id : null;
}
function closeAdminModal(){}   // ページ自体が管理画面。サブモーダルを開く導線が呼ぶので no-op で残す。
function updateAuthBar(){ if (window.appShell) window.appShell.refreshAuth(); }

window.addEventListener('appshell:auth', function () {
  _syncAuthGlobals();
  var isAdmin = !!(window.appShell && window.appShell.user && window.appShell.user.isAdmin);
  document.getElementById('admin-guard-msg').hidden = isAdmin;
  document.getElementById('admin-root').hidden = !isAdmin;
  if (isAdmin) refreshAdminPage();
});

appShell.mount(document.getElementById('app-shell-bar'), {
  nav: window.APP_NAV,
  onNotif: function () { location.href = '/'; }
});

async function refreshAdminPage() {
  await Promise.all([reloadAdminContent(), updateLockBtn(), updateScoreLockBtn()]);
}

async function reloadAdminContent() {
  const el = document.getElementById('admin-content');
  el.innerHTML = '<p style="color:var(--muted);padding:12px 0">読み込み中...</p>';
  const res  = await fetch('/api/admin/users', { headers: { 'Authorization': authToken } });
  const data = await res.json();
  if (!Array.isArray(data)) { el.innerHTML = '<p style="color:red">エラー</p>'; return; }
  document.getElementById('admin-count').textContent = `${data.length}人`;
  el.innerHTML = data.map((u, i) => `
    <div class="admin-card">
      <div class="admin-card-top">
        <span class="avatar frame-${u.frame||'default'}" style="width:32px;height:32px;font-size:1.1rem;flex-shrink:0">${u.avatar||'🐸'}</span>
        <div style="min-width:0">
          <div class="admin-card-name">${i+1}. ${esc(tu(u.username))}</div>
          <div class="admin-card-email">${esc(u.email||'（IDログイン）')}</div>
        </div>
      </div>
      <div class="admin-card-stats">
        <div class="admin-stat">💰 <span>${(u.points||0).toLocaleString()}</span>pt</div>
        <div class="admin-stat">予測 <span>${u.test_pred != null ? u.test_pred+'点' : '―'}</span></div>
        <div class="admin-stat">賭け金 <span>${u.test_bet != null ? u.test_bet.toLocaleString()+'pt' : '―'}</span></div>
      </div>
      <div class="admin-card-grant">
        <input type="number" id="grant-amt-${u.id}" value="500" placeholder="pt">
        <button onclick="grantPoints(${u.id})">付与</button>
        <button onclick="setPoints(${u.id})" style="background:#1e3a5f;color:#7dd3fc;border:1px solid #3b82f6">設定</button>
      </div>
    </div>`).join('');
}
async function grantPoints(userId) {
  const amt = parseInt(document.getElementById(`grant-amt-${userId}`).value);
  if (isNaN(amt) || amt === 0) return;
  const res = await fetch('/api/admin/grant-points', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': authToken },
    body: JSON.stringify({ userId, amount: amt })
  });
  const data = await res.json();
  if (data.ok) { showPointToast(`+${amt.toLocaleString()}pt 付与完了`); await reloadAdminContent(); }
}
async function setPoints(userId) {
  const amt = parseInt(document.getElementById(`grant-amt-${userId}`).value);
  if (isNaN(amt) || amt < 0) return;
  if (!confirm(`このユーザーの個人ポイントを ${amt.toLocaleString()}pt に設定しますか？`)) return;
  const res = await fetch('/api/admin/set-points-user', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': authToken },
    body: JSON.stringify({ userId, points: amt })
  });
  const data = await res.json();
  if (data.ok) { showPointToast(`${amt.toLocaleString()}pt に設定完了`); await reloadAdminContent(); }
  else alert('❌ ' + (data.error || 'エラー'));
}
async function distributePool() {
  if (!confirm('プールを配分しますか？この操作は取り消せません。')) return;
  const res  = await fetch('/api/admin/distribute-pool', { method:'POST', headers:{'Authorization':authToken} });
  const data = await res.json();
  if (!data.ok) { alert(data.error || 'エラー'); return; }
  const lines = data.payouts.map(p => `${p.username}: +${p.amount.toLocaleString()}pt`).join('\n');
  alert(`配分完了！ プール合計: ${data.totalPool.toLocaleString()}pt\n\n${lines}`);
}
async function awardWorstFrame() {
  if (!confirm('ポイント1位の人に🔴ワーストフレームを付与しますか？')) return;
  try {
    const res  = await fetch('/api/admin/award-worst', { method:'POST', headers:{'Authorization':authToken} });
    const data = await res.json();
    if (data.ok) { alert(`✅ ${data.username} にワーストフレームを付与しました`); await reloadAdminContent(); }
    else alert(`❌ エラー (${res.status}): ${data.error || JSON.stringify(data)}`);
  } catch(e) { alert('❌ 通信エラー: ' + e.message); }
}
async function viewSurveyResults() {
  try {
    const res  = await fetch('/api/admin/survey', { headers: { 'Authorization': authToken } });
    const data = await res.json();
    if (!Array.isArray(data)) { alert('エラー: ' + (data.error || 'unknown')); return; }
    if (!data.length) { alert('まだ回答がありません'); return; }
    const qLabels = {
      sq1:'Q1.クリアしたセクション', sq2:'Q2.主に使ったセクション',
      sq3:'Q3.役立ち度', sq4:'Q4.自信度', sq5:'Q5.テスト難易度',
      sq6:'Q6.難易度比較', sq7:'Q7.勉強時間', sq8:'Q8.他の勉強法',
      sq8_other:'Q8.その他(自由)', sq9:'Q9.自由記述'
    };
    const rows = data.map(r => {
      const a = r.answers;
      const cells = Object.entries(qLabels).map(([k, label]) => {
        const v = a[k];
        return `<td style="padding:4px 8px;border:1px solid var(--line);font-size:.78rem;max-width:160px;white-space:pre-wrap;word-break:break-all">${Array.isArray(v) ? v.join(', ') : (v ?? '―')}</td>`;
      }).join('');
      return `<tr><td style="padding:4px 8px;border:1px solid var(--line);font-weight:600;white-space:nowrap">${esc(tu(r.username))}</td><td style="padding:4px 8px;border:1px solid var(--line);text-align:center">${r.test_score ?? '―'}</td>${cells}</tr>`;
    }).join('');
    const headers = ['名前','得点',...Object.values(qLabels)].map(h => `<th style="padding:4px 8px;border:1px solid var(--line);background:var(--card2);font-size:.75rem;white-space:nowrap">${h}</th>`).join('');
    const w = window.open('', '_blank');
    w.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>アンケート結果 (${data.length}件)</title>
    <style>body{font-family:sans-serif;padding:16px;background:#0a1626;color:#e2e8f0}table{border-collapse:collapse}h2{margin-bottom:12px}</style></head>
    <body><h2>📊 アンケート結果（${data.length}件）</h2>
    <div style="overflow-x:auto"><table><thead><tr>${headers}</tr></thead><tbody>${rows}</tbody></table></div></body></html>`);
    w.document.close();
  } catch(e) { alert('通信エラー: ' + e.message); }
}

async function adminAddBanner() {
  const title = prompt('バナータイトル');
  if (!title) return;
  const body  = prompt('バナー本文（HTMLタグ可）');
  if (!body) return;
  const date  = prompt('日付 (YYYY-MM-DD)', new Date().toISOString().slice(0,10));
  try {
    const res  = await fetch('/api/admin/banners', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': authToken },
      body: JSON.stringify({ title, body, date, is_new: true })
    });
    const data = await res.json();
    if (data.ok) { showPointToast('バナーを追加しました'); loadBanners(); }
    else showPointToast('❌ ' + (data.error || 'エラー'));
  } catch(e) { showPointToast('通信エラー'); }
}

async function adminCreateBattles() {
  // レース一覧を取得して選択
  let races = [];
  try { races = await fetch('/api/races').then(r => r.json()); } catch(e) {}

  let raceId = null, raceName = '（なし）';
  if (races.length) {
    const raceList = races.map((r, i) => `${i + 1}. ${r.name}${r.active ? ' ★' : ''}`).join('\n');
    const pick = prompt(`紐づけるレースを番号で選択（Enter でスキップ）\n\n${raceList}`);
    const idx = parseInt(pick) - 1;
    if (!isNaN(idx) && races[idx]) { raceId = races[idx].id; raceName = races[idx].name; }
  }

  const subjectChoices = Object.entries(BATTLE_SUBJ_LABEL).map(([k,v]) => `${k} = ${v}`).join('\n');
  const subject = prompt(`教科コードを入力\n${subjectChoices}`);
  if (!subject) return;
  const label = BATTLE_SUBJ_LABEL[subject] || subject;
  if (!confirm(`「${label}」のバトルを作成します。\nレース: 「${raceName}」\n既存のopen状態バトルは削除されます。`)) return;
  try {
    const res = await fetch('/api/admin/battles/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': authToken },
      body: JSON.stringify({ subject, race_id: raceId })
    });
    const data = await res.json();
    if (data.ok) {
      alert(`✅ バトルをリセットしました（教科: ${data.subject}）\n「➕ ペア追加」でペアを追加してください`);
      await reloadAdminContent(); loadBattleContent();
    } else alert('❌ ' + (data.error || 'エラー'));
  } catch(e) { alert('通信エラー'); }
}

async function adminCloseRace() {
  if (!_currentRace) { alert('アクティブなレースがありません'); return; }
  if (!confirm(`「${_currentRace.name}」を終了しますか？\n終了後は勉強時間の申告ができなくなります。`)) return;
  const res = await fetch(`/api/admin/races/${_currentRace.id}/close`, {
    method: 'POST', headers: { Authorization: authToken }
  }).then(r => r.json());
  if (res.ok) { showPointToast('🔒 レースを終了しました'); closeAdminModal(); loadRaceSection(); }
  else alert(res.error || 'エラー');
}

let _lastBattleSubject = '';
async function adminAddBattlePair() {
  const subjectChoices = Object.entries(BATTLE_SUBJ_LABEL).map(([k,v]) => `${k} = ${v}`).join('\n');
  const subject = prompt(`教科コードを入力\n${subjectChoices}`, _lastBattleSubject);
  if (!subject) return;
  _lastBattleSubject = subject;

// loadTimetable / renderTimetable / openTimetableModal / closeTimetableModal / saveTimetableRow / deleteTimetableRow
// （renderTimetable は #timetable-card / #tt-body が無ければ即 return するので admin.html では無害。
//   toggleTimetable はトップ専用なのでコピーしない。）
async function loadTimetable() {
  try {
    const data = await fetch('/api/exam-timetable').then(r => r.json());
    _timetable = Array.isArray(data) ? data : [];
  } catch(e) { _timetable = []; }
  renderTimetable();
}

function renderTimetable() {
  const card = document.getElementById('timetable-card');
  const body = document.getElementById('tt-body');
  if (!card || !body) return;
  if (!_timetable.length) { card.style.display = 'none'; return; }
  card.style.display = '';

  const examName = _timetable[0].exam || '試験';
  document.getElementById('tt-title').textContent = examName + ' 時間割';

  // 日付ごとにまとめる
  const days = [];
  _timetable.forEach(r => {
    let g = days.find(x => x.date === r.exam_date);
    if (!g) { g = { date: r.exam_date, rows: [] }; days.push(g); }
    g.rows.push(r);
  });
  days.sort((a,b) => a.date < b.date ? -1 : 1);

  const nextDate = (days.find(g => ttDaysLeft(g.date) >= 0) || {}).date;

  body.innerHTML = days.map(g => {
    const n = ttDaysLeft(g.date);
    const lb = ttLeftLabel(n);
    const [y,m,d] = g.date.split('-').map(Number);
    const wd = TT_WD[new Date(y, m-1, d).getDay()];
    const cls = n < 0 ? ' tt-done' : (g.date === nextDate ? ' tt-next' : '');
    const rows = g.rows.map(r => {
      const mins = ttMinutes(r.start_time, r.end_time);
      return `<div class="tt-row">
        <span class="tt-time">${ttEsc(ttShow(r.start_time))}${r.end_time ? '–' + ttEsc(ttShow(r.end_time)) : ''}</span>
        <span class="tt-subject">${ttEsc(r.subject)}</span>
        ${mins ? `<span class="tt-min">${mins}</span>` : ''}
        ${r.teacher ? `<span class="tt-teacher">${ttEsc(r.teacher)}</span>` : ''}
        ${r.note ? `<span class="tt-teacher">${ttEsc(r.note)}</span>` : ''}
        ${r.link ? `<a class="tt-link" href="${ttEsc(r.link)}">対策 →</a>` : ''}
      </div>`;
    }).join('');
    return `<div class="tt-day${cls}">
      <div class="tt-dayhead">
        <span class="tt-date">${m}/${d}（${wd}）</span>
        <span class="tt-left ${lb.cls}">${lb.text}</span>
      </div>
      ${rows}
    </div>`;
  }).join('');
}

  try {
    const data = await fetch('/api/tests').then(r => r.json());
    const pairs = [...new Map(data.map(t => [t.subject+'||'+t.exam, {subject:t.subject,exam:t.exam}])).values()];
    for (const p of pairs) {
      await fetch('/api/admin/exam-schedule', {
        method: 'POST',
        headers: {'Content-Type':'application/json','Authorization':authToken},
        body: JSON.stringify({subject:p.subject, exam:p.exam, archive_after:today})
      });
    }
    await loadExamSchedule();
    await openScheduleModal();
  } catch(e) { alert('エラー: ' + e.message); }
}
async function saveSchedule(idx) {
  const p = _schedulePairs[idx];
  const input = document.getElementById('sch-' + idx);
  const archive_after = input?.value || null;
  if (!archive_after) { alert('日付を選択してください'); return; }
  try {
    const res = await fetch('/api/admin/exam-schedule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': authToken },
      body: JSON.stringify({ subject: p.subject, exam: p.exam, archive_after })
    });
    const data = await res.json();
    if (data.ok) {
      _examSchedule[p.subject + '||' + p.exam] = archive_after;
      applyExamArchive();
      renderFolders();
      if (input) { input.style.borderColor = 'var(--teal)'; setTimeout(() => { input.style.borderColor = ''; }, 1500); }
      openScheduleModal();
    } else alert('❌ ' + (data.error || 'エラー'));
  } catch(e) { alert('通信エラー'); }
}

async function clearSchedule(idx) {
  const p = _schedulePairs[idx];
  try {
    await fetch('/api/admin/exam-schedule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': authToken },
      body: JSON.stringify({ subject: p.subject, exam: p.exam, archive_after: null })
    });
    delete _examSchedule[p.subject + '||' + p.exam];
    tests.forEach(t => { if (t.subject === p.subject && t.exam === p.exam) delete t.archived; });
    applyExamArchive();
    renderFolders();
    openScheduleModal();
  } catch(e) { alert('通信エラー'); }
}

// ── ペア設定: index.html VERBATIM ──
async function openPairModal() {
  closeAdminModal();
  _pairGroupCount = 0;
  document.getElementById('pair-modal-pairs').innerHTML = '';
  document.getElementById('pair-modal-msg').textContent = '';
  document.getElementById('pair-modal-race-name').textContent = '（レース共通のグローバル設定）';
  const [userData, existingPairs] = await Promise.all([
    fetch('/api/admin/users', { headers: { Authorization: authToken } }).then(r => r.json()),
    fetch('/api/pairs').then(r => r.json()).catch(() => [])
  ]);
  _pairModalUsers = (userData.users || userData || []).filter(u => u.username !== 'seijuro_dummy');
  if (existingPairs.length) {
    existingPairs.forEach(p => pairAddGroup(p.name, p.members.map(m => m.user_id)));
  } else {
    pairAddGroup(); pairAddGroup();
  }
  document.getElementById('pair-modal-bg').style.display = 'flex';
}
function closePairModal() { document.getElementById('pair-modal-bg').style.display = 'none'; }

function pairAddGroup(name = '', memberIds = []) {
  _pairGroupCount++;
  const idx = _pairGroupCount;
  const container = document.getElementById('pair-modal-pairs');
  const div = document.createElement('div');
  div.id = `pair-group-${idx}`;
  div.style.cssText = 'background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px';
  div.innerHTML = `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
      <span style="font-size:.85rem;font-weight:700;color:var(--dim)">ペア ${idx}</span>
      <button onclick="document.getElementById('pair-group-${idx}').remove()" style="background:none;border:none;color:var(--dim);font-size:1.1rem;cursor:pointer;padding:2px 6px;margin-left:auto">✕</button>
    </div>
    <div id="pair-members-${idx}" style="display:flex;flex-wrap:wrap;gap:5px">
      ${_pairModalUsers.map(u => {
        const checked = memberIds.includes(u.id) ? 'checked' : '';
        return `<label style="display:flex;align-items:center;gap:4px;font-size:.78rem;cursor:pointer;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)">
          <input type="checkbox" data-uid="${u.id}" ${checked} style="accent-color:var(--teal)"> ${esc(u.username)}
        </label>`;
      }).join('')}
    </div>`;
  container.appendChild(div);
}

async function savePairs() {
  const pairs = [];
  let i = 1, pairNum = 1;
  while (i <= _pairGroupCount) {
    const g = document.getElementById(`pair-group-${i}`);
    if (g) {
      const members = [...g.querySelectorAll('input[type=checkbox]:checked')].map(cb => parseInt(cb.dataset.uid));
      pairs.push({ name: `ペア${pairNum++}`, members });
    }
    i++;
  }
  const res = await fetch('/api/admin/pairs', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: authToken },
    body: JSON.stringify({ pairs })
  }).then(r => r.json());
  if (res.ok) {
    document.getElementById('pair-modal-msg').textContent = '✅ 保存しました';
    loadRaceSection();
  } else {
    document.getElementById('pair-modal-msg').textContent = '❌ ' + (res.error || 'エラー');
  }
}

// ── レース発行: index.html VERBATIM ──
async function openRaceModal() {
  closeAdminModal();
  document.getElementById('race-modal-msg').textContent = '';
  document.getElementById('race-name-input').value = '';
  // 教科一覧（固定リスト + tests.jsonの教科をマージ）
  const sel = document.getElementById('race-subject-input');
  const fixedSubjects = ['科学技術英語Ⅰ', '応用物理', '応用数学', '加工学', '熱流体工学Ⅰ', '制御工学Ⅰ'];
  const testSubjects = (typeof tests !== 'undefined' ? tests : []).map(t => t.subject).filter(Boolean);
  const subjects = [...new Set([...fixedSubjects, ...testSubjects])];
  sel.innerHTML = '<option value="">（教科を選択）</option>' + subjects.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join('');
  document.getElementById('race-modal-bg').style.display = 'flex';
  const data = await fetch('/api/admin/users', { headers: { Authorization: authToken } }).then(r => r.json());
  _raceModalUsers = (data.users || data || []).filter(u => u.username !== 'seijuro_dummy');
}
function closeRaceModal() { document.getElementById('race-modal-bg').style.display = 'none'; }

function raceAddGroup() {
  _raceGroupCount++;
  const idx = _raceGroupCount;
  const wrap = document.getElementById('race-modal-groups');
  const row = document.createElement('div');
  row.className = 'race-group-row';
  row.id = `race-group-row-${idx}`;
  row.innerHTML = `<span style="font-size:.76rem;color:var(--dim);white-space:nowrap">組${idx}</span>
    <input type="text" id="race-group-name-${idx}" placeholder="グループ名（例: チームA）" value="チーム${String.fromCharCode(64 + idx)}">
    <button onclick="document.getElementById('race-group-row-${idx}').remove();_renderRaceModalUsers()" style="padding:3px 8px;border:1px solid var(--line);border-radius:4px;background:none;color:var(--rose);cursor:pointer;font-size:.76rem;font-family:inherit">✕</button>`;
  wrap.appendChild(row);
  _renderRaceModalUsers();
}

function _renderRaceModalUsers() {
  const wrap = document.getElementById('race-modal-users');
  const groupRows = Array.from(document.getElementById('race-modal-groups').querySelectorAll('.race-group-row'));
  const groupOpts = groupRows.map(r => {
    const idx = r.id.replace('race-group-row-', '');
    const name = document.getElementById(`race-group-name-${idx}`)?.value || `グループ${idx}`;
    return { idx, name };
  });
  wrap.innerHTML = _raceModalUsers.map(u => {
    const sel = `race-user-group-${u.id}`;
    const opts = [`<option value="">（なし）</option>`,
      ...groupOpts.map(g => `<option value="${g.idx}">${esc(g.name)}</option>`)].join('');
    return `<div style="display:flex;align-items:center;gap:8px">
      <span style="flex:1;font-size:.82rem">${esc(u.username)}</span>
      <select id="${sel}" style="padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:.8rem;font-family:inherit">${opts}</select>
    </div>`;
  }).join('');
}

async function adminCreateRace() {
  const name = document.getElementById('race-name-input').value.trim();
  if (!name) { document.getElementById('race-modal-msg').textContent = 'レース名を入力してください'; return; }
  // 全メンバーを1グループとして自動参加（グループ表示はペアから取得）
  const groups = [{ name: '全員', members: _raceModalUsers.map(u => u.id) }];
  const start_date = document.getElementById('race-start-input').value;
  const end_date   = document.getElementById('race-end-input').value;
  const subject    = document.getElementById('race-subject-input').value;
  const res = await fetch('/api/admin/races', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': authToken },
    body: JSON.stringify({ name, start_date, end_date, subject, groups })
  }).then(r => r.json());
  if (res.ok) {
    showPointToast('🏁 レースを発行しました');
    closeRaceModal();
    loadRaceSection();
  } else {
    document.getElementById('race-modal-msg').textContent = res.error || 'エラー';
  }
}
</script>
